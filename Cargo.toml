[package]
name = "ngx_mbrotli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "NGINX Brotli compression modules (drop-in for google/ngx_brotli) built on ngx-rust and mbrotli"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mbrotli = { version = "0.5.6", default-features = false, features = ["std", "compression"] }
ngx = { version = "0.5.1", default-features = false, features = ["std"] }
# Required by build.rs to receive DEP_NGINX_* metadata.
nginx-sys = "0.5.0"

[build-dependencies]
cc = "1.2"

[features]
default = ["export-modules"]
# Generate the `ngx_modules` export table required to load the cdylib with
# `load_module`. Disable when linking the module through the NGINX build system.
export-modules = []
# Build against a vendored copy of the NGINX sources (see the nginx-src crate).
vendored = ["ngx/vendored"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
