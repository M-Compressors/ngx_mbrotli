name: Binaries

# Builds the module for the NGINX versions that nginx.org and the major Linux
# distributions ship, on x86_64 and aarch64, tests every build in those
# distributions' own nginx, and attaches the archives to a GitHub Release.
#
# NGINX loads a module only if it was built for the same version and the same
# "signature" (see .github/scripts/build-module.sh). nginx.org, Debian, Ubuntu,
# RHEL, Fedora and Amazon Linux build NGINX with --with-compat, so one module per
# version, architecture and C library serves all of them; Alpine gets a build per
# release.
#
# Releases call this workflow after they are tagged (release.yml). To add
# archives to an existing release, for example for a new NGINX version, run it
# by hand with the release's tag: the module is built from the tag with the
# scripts and versions of the branch the workflow runs from.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the archives to; empty builds and tests the branch only.
        type: string
        default: ""
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/binaries.yml
      - install.sh

permissions:
  contents: read

env:
  MODULE_DIR: ${{ inputs.tag && 'module' || '.' }}
  # Docker's official images, from a mirror without Docker Hub's pull limits.
  REGISTRY: public.ecr.aws/docker/library

jobs:
  build:
    name: build nginx ${{ matrix.nginx }} (${{ matrix.arch }}-linux-${{ matrix.libc }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        libc: [gnu, musl]
        # Every version below is shipped by one of the distributions tested in
        # the `test` job, or is the current nginx.org stable or mainline.
        # Versions before 1.23.0 (Debian 12, Ubuntu 22.04, RHEL 9's default
        # stream) are not supported.
        nginx:
          - 1.24.0 # Ubuntu 24.04; RHEL 8 and 9, nginx:1.24 stream
          - 1.26.3 # Debian 13; RHEL 10; RHEL 9, nginx:1.26 stream
          - 1.28.3 # Ubuntu 26.04
          - 1.30.5 # nginx.org stable; Fedora; Amazon Linux 2023
          - 1.31.6 # nginx.org mainline
        include:
          # The oldest supported glibc and musl releases, so that the module
          # runs on every newer one.
          - libc: gnu
            image: almalinux:8
            test-image: nginx
          - libc: musl
            image: alpine:3.21
            test-image: nginx
            test-suffix: -alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.tag
        with:
          ref: ${{ inputs.tag }}
          path: module

      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          NGINX: ${{ matrix.nginx }}
        run: |
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/dist:/dist" \
            -e MODULE_DIR="/repo/$MODULE_DIR" \
            "$REGISTRY/$IMAGE" /repo/.github/scripts/container-build.sh "$NGINX" /dist

      - name: Install the brotli CLI
        run: sudo apt-get install -y -qq --no-install-recommends brotli

      # The official image of the same version, on Debian or Alpine.
      - name: Test in ${{ matrix.test-image }}:${{ matrix.nginx }}${{ matrix.test-suffix }}
        env:
          IMAGE: ${{ matrix.test-image }}:${{ matrix.nginx }}${{ matrix.test-suffix }}
        run: .github/scripts/smoke-test.sh "$REGISTRY/$IMAGE" "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.nginx }}-${{ matrix.arch }}-${{ matrix.libc }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  # Alpine builds NGINX without --with-compat before 3.23 and patches it in ways
  # that change its structures, so each release gets a module built with its
  # own nginx's arguments and patches.
  build-alpine:
    name: build alpine${{ matrix.alpine }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        alpine: ["3.21", "3.22", "3.23", "3.24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.tag
        with:
          ref: ${{ inputs.tag }}
          path: module

      - name: Build
        env:
          IMAGE: alpine:${{ matrix.alpine }}
          LABEL: alpine${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/dist:/dist" \
            -e MODULE_DIR="/repo/$MODULE_DIR" -e LABEL \
            "$REGISTRY/$IMAGE" sh -c 'apk add -q nginx &&
              version=$(nginx -v 2>&1 | sed "s|.*/||") &&
              /repo/.github/scripts/container-build.sh "$version" /dist "$LABEL"'

      - name: Install the brotli CLI
        run: sudo apt-get install -y -qq --no-install-recommends brotli
      - name: Test
        env:
          IMAGE: alpine:${{ matrix.alpine }}
          LABEL: alpine${{ matrix.alpine }}
        run: .github/scripts/smoke-test.sh "$REGISTRY/$IMAGE" "$RUNNER_TEMP/dist" "$LABEL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-alpine${{ matrix.alpine }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  # Each distribution's own nginx package, with the module built for its
  # version. A distribution whose nginx has moved on to a version that is not
  # built yet gets a warning, not a failure.
  test:
    name: test ${{ matrix.target.name }} (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        target:
          - { name: Debian 13, image: "debian:13" }
          - { name: Ubuntu 24.04, image: "ubuntu:24.04" }
          - { name: Ubuntu 26.04, image: "ubuntu:26.04" }
          - name: AlmaLinux 8, nginx 1.24
            image: almalinux:8
            setup: dnf module enable -y -q nginx:1.24
          - name: AlmaLinux 9, nginx 1.24
            image: almalinux:9
            setup: dnf module enable -y -q nginx:1.24
          - name: AlmaLinux 9, nginx 1.26
            image: almalinux:9
            setup: dnf module enable -y -q nginx:1.26
          - { name: AlmaLinux 10, image: "almalinux:10" }
          - { name: Fedora, image: "fedora:latest" }
          - { name: Amazon Linux 2023, image: "amazonlinux:2023" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*-${{ matrix.arch }}-gnu
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Install the brotli CLI
        run: sudo apt-get install -y -qq --no-install-recommends brotli
      - name: Test
        env:
          IMAGE: ${{ matrix.target.image }}
          SETUP: ${{ matrix.target.setup }}
        run: .github/scripts/smoke-test.sh "$REGISTRY/$IMAGE" "$RUNNER_TEMP/dist"

  publish:
    name: attach to ${{ inputs.tag }}
    needs: [build, build-alpine, test]
    if: inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      # SHA256SUMS, which install.sh verifies downloads against, covers every
      # archive of the release, including those that earlier runs attached.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          gh release download "$TAG" --pattern '*.tar.gz' --dir all --repo "$GITHUB_REPOSITORY"
          (cd all && sha256sum -- *.tar.gz) >SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
